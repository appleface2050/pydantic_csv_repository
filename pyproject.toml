[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-csv-repository"
version = "0.1.0"
description = "Safe local CSV persistence for Pydantic models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
frictionless = [
    "frictionless[csv]>=5.18,<6",
]
dev = [
    "build>=1.2",
    "frictionless[csv]>=5.18,<6",
    "pytest>=8.0,<9",
    "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
